name: simple_chat
publish_to: "none"

environment:
  sdk: ">=3.6.2 <4.0.0"
  flutter: ">=3.27.4 <4.0.0"

resolution: workspace

dependencies:
  a2ui_core: ^0.1.0
  audioplayers: ^6.6.0
  dartantic_ai: ^3.2.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: 1.0.3
  genui: ^0.10.0
