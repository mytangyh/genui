name: genui
description: Generates and displays generative user interfaces (GenUI) in Flutter using AI.
version: 0.10.7
homepage: https://github.com/flutter/genui/tree/main/packages/genui
license: BSD-3-Clause
issue_tracker: https://github.com/flutter/genui/issues

environment:
  sdk: ">=3.6.2 <4.0.0"
  flutter: ">=3.27.4"

resolution: workspace

dependencies:
  a2ui_core: ^0.1.0
  audioplayers: ^6.6.0
  collection: ^1.19.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: 1.0.3
  genai_primitives: ^0.2.3
  intl: ^0.19.0
  json_schema_builder: ^0.1.3
  logging: ^1.3.0
  meta: ^1.15.0
  stream_transform: ^2.1.1
  url_launcher: ^6.3.2
  uuid: ^4.4.0
  video_player: 2.10.0
  video_player_win: ^3.2.2

dev_dependencies:
  async: ^2.11.0
  build: ^2.4.2
  build_runner: ^2.4.14
  flutter_test:
    sdk: flutter
  network_image_mock: ^2.1.1
  test: ^1.25.8


